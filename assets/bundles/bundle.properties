# FlameOut mod - default bundle (English)
# Key prefix "flameout" comes from the "name" field in mod.json.
# Use \n inside a value to insert a line break.

# --- Units ---
unit.flameout-empathy.name = Empathy
unit.flameout-empathy.description = Its prison was enlisted for the outerversal war. However due to a mistake that suddenly end the war, costing most of the lives of those who oppose the End.\nTheir bodies either annihilated, distort, or suddenly shifted; as their form is not supported in this sector of reality, only held together by the Kami.\nThose who survived either died from the forces of End, or stranded in this reality. The Prison Apathy wanders the universe aimlessly, waiting for its purpose to unleash the force inside it.\nIts unknown whether this force could compete with the End before the "Weakening".

unit.flameout-apathy.name = Apathy
unit.flameout-apathy.description = There's something inside.

unit.flameout-apathy-sweep-0.name = Apathy Sentry
unit.flameout-apathy-sweep-0.description = A detached laser sentry deployed by Apathy.

unit.flameout-despondency.name = Despondency
unit.flameout-despondency.description = A smaller variant of the original, lacks most of the capabilities but still devastating. Placed across the cosmos to annihilate and demoralizes those who go against The End.

unit.flameout-yggdrasil.name = Yggdrasil
unit.flameout-yggdrasil.description = A massive support unit that attacks with a system of tentacles.

# --- Blocks ---
block.flameout-unit-cleaner.name = Unit Cleaner
block.flameout-unit-cleaner.description = Sandbox-only utility block. Clears all non-player units on the map.
