# FlameOut 模组 - 简体中文语言包
# 键名中的 flameout 前缀来自 mod.json 的 name 字段。
# 值里的 \n 表示换行。

# --- 单位 ---
unit.flameout-empathy.name = 共鸣
unit.flameout-empathy.description = 它的囚笼被征召，投入了越界宇宙的战争。然而由于一次失误，战争骤然终结，也让大多数对抗「终末」者付出了性命。\n它们的躯体或被湮灭，或扭曲，或骤然移位；因为它们的形态并不被这一现实扇区所容纳，只靠着「神」维系在一起。\n幸存者要么死于「终末」之力，要么被困在这片现实中。囚笼——冷漠，漫无目的地在宇宙中游荡，等待命定之时到来，以释放体内蕴藏的力量。\n在「削弱」降临之前，这股力量能否与「终末」抗衡，尚且未知。

unit.flameout-apathy.name = 冷漠
unit.flameout-apathy.description = 其中有某种东西。

unit.flameout-apathy-sweep-0.name = 冷漠哨兵
unit.flameout-apathy-sweep-0.description = 由冷漠释放的独立激光哨兵。

unit.flameout-despondency.name = 消沉
unit.flameout-despondency.description = 原体的缩小变体，失去了大部分能力，却依然具有毁灭性。它被散布在宇宙各处，用以歼灭并挫败那些与「终末」为敌之人。

unit.flameout-yggdrasil.name = 世界树
unit.flameout-yggdrasil.description = 大型支援单位，以触手系统进行攻击。

# --- 方块 ---
block.flameout-unit-cleaner.name = 单位清除器
block.flameout-unit-cleaner.description = 仅沙盒可用的功能方块，可清除地图上所有非玩家单位。
