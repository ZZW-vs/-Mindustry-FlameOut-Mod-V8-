name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 不再使用 android-actions/setup-android@v3：该 action 会执行 `sdkmanager tools`，
    # 而 `tools` 包已从 Android SDK 仓库移除，会导致 "Failed to find package 'tools'" 直接失败。
    # ubuntu-latest 运行器已预装 SDK（ANDROID_HOME=/usr/local/lib/android/sdk），这里直接使用。
    - name: Set up Android SDK
      run: |
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager "build-tools;34.0.0" "platforms;android-34" > /dev/null
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls "$ANDROID_HOME/build-tools"
        ls "$ANDROID_HOME/platforms"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Desktop Jar
      run: ./gradlew jar

    - name: Build Android (Deploy) Jar
      run: ./gradlew deploy

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: flameout
        path: build/libs/flameout.jar
